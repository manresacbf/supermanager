<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Supermanager U16</title>
<link rel="manifest" href="manifest-u16.json" />
<meta name="theme-color" content="#15151f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SM U16" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="top">
  <div class="badge">SM</div>
  <div>
    <h1>Supermanager MCBF 26/27</h1>
    <div class="sub" id="header-sub">Carregant…</div>
  </div>
</header>

<main id="app">
  <div class="loading">Carregant dades…</div>
</main>

<nav class="bottom">
  <button data-view="meuequip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    El meu equip
  </button>
  <button data-view="escollir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Escollir equip
  </button>
  <button data-view="classificacio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    Classificació
  </button>
  <button data-view="preguntes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Preguntes
  </button>
</nav>

<script>window.CATEGORIA_FIXA = 'U16';</script>
<script src="app.js"></script>

</html>
